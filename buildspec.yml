version: 0.2

env:
  variables:
    GOCACHE: "/tmp/go-cache"

phases:
  install:
    commands:
      - mkdir -p /tmp/go-cache
      - go version

  pre_build:
    commands:
      - cd $CODEBUILD_SRC_DIR/api-gateway && go mod download
      - cd $CODEBUILD_SRC_DIR/order-service && go mod download
      - cd $CODEBUILD_SRC_DIR/product-service && go mod download

  build:
    commands:
      - mkdir -p $CODEBUILD_SRC_DIR/bin
      - cd $CODEBUILD_SRC_DIR/order-service && go test -v ./tests/...
      # Build all three microservices
      - cd $CODEBUILD_SRC_DIR/api-gateway && GOOS=linux GOARCH=amd64 go build -o $CODEBUILD_SRC_DIR/bin/api-gateway main.go
      - cd $CODEBUILD_SRC_DIR/order-service && GOOS=linux GOARCH=amd64 go build -o $CODEBUILD_SRC_DIR/bin/order-service main.go
      - cd $CODEBUILD_SRC_DIR/product-service && GOOS=linux GOARCH=amd64 go build -o $CODEBUILD_SRC_DIR/bin/product-service main.go
      # Generate the bin/application launcher directly inside the build
      - |
        cat << 'EOF' > $CODEBUILD_SRC_DIR/bin/application
        #!/bin/sh
        DIR="$(cd "$(dirname "$0")" && pwd)"
        $DIR/product-service &
        $DIR/order-service &
        exec $DIR/api-gateway
        EOF
      - chmod +x $CODEBUILD_SRC_DIR/bin/*

artifacts:
  files:
    - bin/*
    - Procfile